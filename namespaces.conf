# Namespace overrides for helm charts
# Format: chart-name=namespace
# Lines starting with # are comments
#
# Copy to your project root and customize.
# helm-common.sh searches: $INFRA_ROOT/namespaces.conf → k8-lib/namespaces.conf
#
# Common overrides (uncomment and customize):
# nginx-ingress=ingress-nginx
# aws-lb-controller=kube-system
# infisical-operator=infisical-operator
# karpenter=karpenter
# keda=keda
# vpa=vpa
# goldilocks=goldilocks
# kubecost=kubecost
# parca=parca
# openebs-lvm=openebs
